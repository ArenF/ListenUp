# ListenUp — amelia Docker 배포 (client=정적 nginx / server=node API)
# 클로이 작성 2026-09-17 · 3테마(다크/라이트/아케이드) 적용본

services:
  client:
    image: nginx:alpine
    container_name: listenup-client
    ports:
      - "8080:80"
    volumes:
      - ./packages/client/dist:/usr/share/nginx/html:ro
      - ./docker/client-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: listenup-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./packages/server/src/data:/app/data   # playlists.json 등 영속화
      - ./packages/server/uploads:/app/packages/server/uploads   # 아바타·배경 업로드 영속화
    restart: unless-stopped